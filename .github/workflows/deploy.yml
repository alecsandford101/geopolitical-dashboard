name: Deploy to GitHub Pages

# Build the Vite app and publish it to GitHub Pages.
# Runs on push, hourly (to refresh live GDELT data), and on manual dispatch.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # hourly at :17 (off-:00 to dodge GitHub's top-of-hour load)
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

# Permissions the GITHUB_TOKEN needs to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch live GDELT data
        run: node scripts/fetch-events.js

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
