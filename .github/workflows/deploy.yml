name: Deploy to GitHub Pages

# Build the Vite app and publish it to GitHub Pages.
# Runs on push, hourly (to refresh live GDELT data), and on manual dispatch.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # hourly at :17 (off-:00 to dodge GitHub's top-of-hour load)
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

# Permissions the GITHUB_TOKEN needs to publish Pages and commit refreshed data.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fetch fresh GDELT data ONLY on the hourly schedule or a manual run.
      # Ordinary code pushes skip this (the slow, sometimes-throttled step) and
      # reuse the events.json committed by the last data refresh — so UI deploys
      # stay fast (~1 min) instead of waiting several minutes on GDELT.
      - name: Fetch live GDELT data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-events.js

      # Persist the freshly-fetched data back to the repo so the next push-triggered
      # build reuses it. GITHUB_TOKEN pushes don't retrigger workflows, and [skip ci]
      # is belt-and-suspenders; the push is non-fatal so a conflict never blocks deploy.
      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/events.json
          if [ -f .cache/translations.json ]; then git add .cache/translations.json; fi
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh GDELT data [skip ci]"
            git push || echo "Push failed (non-fatal); continuing with build."
          fi

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
